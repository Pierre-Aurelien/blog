<header id="title-block-header" class="quarto-title-block default">
<div class="quarto-title">
$if(kicker)$
<p class="kicker">$kicker$$if(date)$ · $date$$endif$$if(date-modified)$ · revised $date-modified$$endif$</p>
$endif$
$if(title)$
<h1 class="title">$title$</h1>
$endif$
$if(subtitle)$
<p class="subtitle lead">$subtitle$</p>
$endif$
</div>
</header>
